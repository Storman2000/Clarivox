[project]
name = "clarivox"
version = "1.0.0"
description = "Healthcare Voicemail Processing System with Speech-to-Text, Intent Extraction, and FHIR Generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "Clarivox Team" }
]

dependencies = [
    # FastAPI and web server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "starlette>=0.40.0",
    # Audio processing
    "pydub>=0.25.1",
    "av>=12.0.0",
    # Speech-to-Text (Whisper)
    "faster-whisper>=1.0.0",
    "openai-whisper>=20231117",
    # NLP and Intent Extraction
    "spacy>=3.7.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    # HTTP client
    "httpx>=0.27.0",
    "requests>=2.31.0",
    # AWS (optional, for CloudWatch metrics)
    "boto3>=1.34.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "tqdm>=4.66.0",
    "en-core-web-sm>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
]

# SpaCy model source (not on PyPI)
[[tool.uv.find-links]]
url = "https://github.com/explosion/spacy-models/releases/expanded_assets/en_core_web_sm-3.8.0"
